name: Build XuitchTV Nintendo Switch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/xuitchtv-next

jobs:
  build-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout XuitchTV and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify XuitchTV source contract
        run: python3 scripts/verify_xuitchtv.py

      - name: Build Nintendo Switch NRO
        run: |
          docker run --platform linux/amd64 --rm \
            -e M3U8_URL="https://raw.githubusercontent.com/iptv-org/iptv/master/streams/py.m3u" \
            -v "$(pwd):/data" \
            devkitpro/devkita64:20251117 \
            bash -c "/data/scripts/build_switch.sh"

      - name: Prepare SD package
        run: |
          mkdir -p dist/switch/XuitchTV
          cp cmake-build-switch/XuitchTV.nro dist/switch/XuitchTV/XuitchTV.nro
          cp README.md dist/switch/XuitchTV/README.txt
          cd dist
          zip -qr XuitchTV-Next-SD.zip switch

      - name: Upload XuitchTV NRO
        uses: actions/upload-artifact@v4
        with:
          name: XuitchTV-Next-nro
          path: cmake-build-switch/XuitchTV.nro
          if-no-files-found: error

      - name: Upload XuitchTV SD package
        uses: actions/upload-artifact@v4
        with:
          name: XuitchTV-Next-SD
          path: dist/XuitchTV-Next-SD.zip
          if-no-files-found: error
